[project]
name = "verikyb"
version = "0.1.0"
description = "dev-kyb"
readme = "README.md"
authors = [
    { name = "abhishek-tiwari-nitrr", email = "abhishek.tiwari.nitrr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "litellm>=1.106.6",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
]

[project.scripts]
verikyb = "verikyb:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
