trigger:
  branches:
    include:
      - dev
      - main

pr:
  branches:
    include:
      - dev
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  UV_CACHE_DIR: '$(Pipeline.Workspace)/.uv-cache'

steps:
  - checkout: self
    persistCredentials: false

  - task: UsePythonVersion@0
    name: selectPython
    displayName: Use Python 3.14
    inputs:
      versionSpec: '3.14'
      architecture: x64

  - script: python -m pip install uv==0.12.5
    displayName: Install uv 0.12.5

  - task: Cache@2
    displayName: Restore uv dependency cache
    inputs:
      key: '"uv-v1" | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "uv-0.12.5" | "python-$(selectPython.pythonLocation)" | uv.lock'
      path: '$(UV_CACHE_DIR)'

  - script: uv sync --locked --python "$(selectPython.pythonLocation)/bin/python"
    displayName: Install locked dependencies
    env:
      UV_HTTP_CONNECT_TIMEOUT: '60'
      UV_HTTP_TIMEOUT: '120'
      UV_HTTP_RETRIES: '5'

  - script: uv run --no-sync ruff check .
    displayName: Check lint

  - script: uv run --no-sync ruff format --check .
    displayName: Check formatting

  - script: uv run --no-sync mypy
    displayName: Check types

  - script: uv run --no-sync pytest
    displayName: Run tests
    env:
      PYTEST_ADDOPTS: '--junitxml=$(Common.TestResultsDirectory)/pytest.xml'

  - task: PublishTestResults@2
    displayName: Publish pytest results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: pytest.xml
      searchFolder: '$(Common.TestResultsDirectory)'
      failTaskOnFailedTests: true
      testRunTitle: VeriKYB pytest
