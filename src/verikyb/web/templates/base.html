<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VeriKYB{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable" href="#main">Skip to main content</a>
  <header class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('home.index') }}">VeriKYB</a>
      {# Request pages fill this with the request ID and status, so both are always visible. #}
      {% block request_header %}{% endblock %}
    </div>
  </header>
  <main id="main" class="container flex-grow-1 py-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-top py-3 small text-body-secondary">
    <div class="container">This is a portfolio (poc) project, not legal or compliance advice.</div>
  </footer>
</body>
</html>
